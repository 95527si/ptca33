<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>멸종위기 동물 인터뷰 — 만난 적 없는 생명에게 묻다</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E9EFE9;
  --card:#FFFFFF;
  --ink:#16332B;
  --ink-2:#4C6660;
  --ink-3:#8AA09A;
  --rule:#D2DED7;
  --mark:#D8892C;
  --accent:#2F6B58;
  --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:16px;line-height:1.65;
  padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:820px;margin:0 auto;padding:0 18px}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px;border-radius:6px}
[hidden]{display:none !important}

/* ---------- 1. 취재 명단 ---------- */
#pick{padding:34px 0 60px}
.masthead{border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:26px}
.masthead h1{
  font-family:"Gowun Batang",serif;font-weight:700;
  font-size:30px;line-height:1.3;margin:0 0 8px;letter-spacing:-.01em;
}
.masthead p{margin:0;color:var(--ink-2);font-size:14px;max-width:52ch}
.rail{
  display:flex;gap:8px;align-items:baseline;
  font-size:12px;color:var(--ink-3);margin-bottom:20px;
}
.rail b{color:var(--mark);font-weight:600}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (max-width:430px){.grid{grid-template-columns:1fr}}

.beast{
  display:block;width:100%;text-align:left;
  background:var(--card);border-radius:var(--radius);
  padding:16px 16px 18px;
  border-left:5px solid var(--tone,#2F6B58);
  box-shadow:0 1px 0 var(--rule);
  transition:transform .12s ease;
}
.beast:active{transform:scale(.985)}
.beast .top{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.beast .face{line-height:0}
.face svg{width:40px;height:40px;display:block}
.bar .face svg{width:36px;height:36px}
.beast .nm{font-family:"Gowun Batang",serif;font-weight:700;font-size:19px}
.tag{
  display:inline-block;font-size:11px;font-weight:600;
  padding:2px 7px;border-radius:4px;
  background:var(--tone,#2F6B58);color:#fff;
}
.beast .say{
  font-family:"Gowun Batang",serif;font-size:15px;color:var(--ink-2);
  margin:0;line-height:1.6;
}
.beast .meta{margin-top:10px;font-size:12px;color:var(--ink-3)}

/* ---------- 2. 인터뷰 ---------- */
#talk{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.bar{
  position:sticky;top:0;z-index:5;
  background:var(--tone,#2F6B58);color:#fff;
  padding:12px 18px;
}
.bar .row{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:11px}
.bar .face{font-size:27px}
.bar .nm{font-family:"Gowun Batang",serif;font-weight:700;font-size:18px;line-height:1.2}
.bar .sub{font-size:11.5px;opacity:.85;line-height:1.3}
.bar .back,.bar .book{
  background:rgba(255,255,255,.16);border-radius:8px;
  padding:7px 11px;font-size:13px;font-weight:500;white-space:nowrap;
}
.bar .book{position:relative}
.bar .book span{
  position:absolute;top:-5px;right:-5px;background:var(--mark);
  border-radius:9px;font-size:10px;padding:0 5px;font-weight:600;
}
.spacer{flex:1}

.thread{flex:1;padding:20px 0 8px}
.turn{margin-bottom:16px;display:flex;flex-direction:column}
.turn.me{align-items:flex-end}
.bub{
  max-width:88%;padding:11px 15px;border-radius:16px;
  white-space:pre-wrap;
}
.turn.me .bub{
  background:var(--ink);color:#fff;border-bottom-right-radius:5px;font-size:15px;
}
.turn.it .bub{
  background:var(--card);border-bottom-left-radius:5px;
  font-family:"Gowun Batang",serif;font-size:16.5px;line-height:1.75;
  box-shadow:0 1px 0 var(--rule);
}
.btnrow{display:flex;gap:6px;margin:7px 0 0 3px;flex-wrap:wrap}
.keep,.srcbtn{
  font-size:12.5px;color:var(--ink-2);
  border:1px solid var(--rule);background:var(--card);
  border-radius:20px;padding:4px 12px;
}
.keep.on{background:var(--mark);border-color:var(--mark);color:#fff;font-weight:500}
.srcbtn.on{background:var(--ink);border-color:var(--ink);color:#fff}
.srcbox{
  margin:8px 0 0 3px;max-width:88%;
  font-size:12.5px;line-height:1.65;color:var(--ink-2);
  border-left:3px solid var(--rule);padding:2px 0 2px 11px;
}
.srcbox b{display:block;font-size:11px;color:var(--ink-3);font-weight:600;margin-bottom:2px}
.dots{font-family:"Gowun Batang",serif;color:var(--ink-3)}

.asks{
  position:sticky;bottom:0;background:var(--paper);
  border-top:1px solid var(--rule);padding:11px 0 14px;
}
.chips{display:flex;gap:7px;overflow-x:auto;padding:0 18px 10px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{
  white-space:nowrap;background:var(--card);border:1px solid var(--rule);
  border-radius:20px;padding:7px 13px;font-size:13.5px;color:var(--ink);flex:0 0 auto;
}
.chip.used{color:var(--ink-3);background:transparent}
.entry{display:flex;gap:8px;padding:0 18px;max-width:820px;margin:0 auto}
.entry input{
  flex:1;font-family:inherit;font-size:15px;padding:11px 14px;
  border:1px solid var(--rule);border-radius:22px;background:var(--card);color:var(--ink);
}
.entry input:focus{outline:2px solid var(--tone,#2F6B58);outline-offset:0}
.entry button{
  background:var(--tone,#2F6B58);color:#fff;border-radius:22px;
  padding:0 18px;font-weight:600;font-size:14px;
}

/* ---------- 3. 수첩 ---------- */
#note{padding:26px 0 70px}
#note h2{font-family:"Gowun Batang",serif;font-size:24px;margin:0 0 4px}
#note .lead{color:var(--ink-2);font-size:14px;margin:0 0 20px}
.who{display:flex;gap:8px;margin-bottom:20px}
.who input{
  flex:1;font-family:inherit;font-size:15px;padding:10px 14px;
  border:1px solid var(--rule);border-radius:10px;background:var(--card);color:var(--ink);
}
.note-item{
  background:var(--card);border-radius:var(--radius);padding:14px 16px;
  margin-bottom:11px;border-left:5px solid var(--tone,#2F6B58);
}
.note-item .q{font-weight:600;font-size:14px;margin-bottom:6px}
.note-item .a{font-family:"Gowun Batang",serif;font-size:15.5px;line-height:1.7;color:var(--ink-2)}
.note-item .ns{margin-top:8px;padding-top:7px;border-top:1px dashed var(--rule);font-size:12px;color:var(--ink-3);line-height:1.55}
.note-item .rm{font-size:12px;color:var(--ink-3);margin-top:8px}
.empty{
  border:1px dashed var(--rule);border-radius:var(--radius);
  padding:26px 20px;text-align:center;color:var(--ink-2);font-size:14.5px;
}
.acts{display:flex;gap:9px;margin-top:22px;flex-wrap:wrap}
.btn{
  border-radius:10px;padding:12px 18px;font-size:14.5px;font-weight:500;
  background:var(--ink);color:#fff;
}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.foot{margin-top:38px;padding-top:16px;border-top:1px solid var(--rule);font-size:12px;color:var(--ink-3);line-height:1.7}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>

<!-- ========== 1. 취재 명단 ========== -->
<section id="pick"><div class="wrap">
  <div class="masthead">
    <h1>한 번도 만난 적 없는 생명을,<br>우리는 어떻게 지킬 수 있을까?</h1>
    <p>다섯 마리가 대답을 기다리고 있습니다. 한 마리를 골라 기자가 되어 물어보세요.</p>
  </div>
  <div class="rail"><span>취재 명단</span><b>5종</b><span>· 수달만 우리나라에 살고, 넷은 아시아 곳곳에 삽니다</span></div>
  <div class="grid" id="grid"></div>
  <div class="foot">
    답변 속 숫자는 환경부, 세계자연보전연맹(IUCN), 세계자연기금(WWF), 각 나라 정부 조사에서 공개한 최근 값을 바탕으로 했습니다.
    조사한 해에 따라 달라질 수 있으니, 수업에서는 “정확한 수”보다 “왜 이렇게 적은가”를 묻는 데 써 주세요.
  </div>
</div></section>

<!-- ========== 2. 인터뷰 ========== -->
<section id="talk" hidden>
  <div class="bar" id="bar">
    <div class="row">
      <span class="face" id="barFace"></span>
      <div>
        <div class="nm" id="barName"></div>
        <div class="sub" id="barSub"></div>
      </div>
      <span class="spacer"></span>
      <button class="book" id="toNote">수첩<span id="cnt" hidden>0</span></button>
      <button class="back" id="toPick">나가기</button>
    </div>
  </div>
  <div class="wrap thread" id="thread"></div>
  <div class="asks">
    <div class="chips" id="chips"></div>
    <div class="entry">
      <input id="q" placeholder="궁금한 것을 직접 물어보세요" autocomplete="off" enterkeyhint="send">
      <button id="send">묻기</button>
    </div>
  </div>
</section>

<!-- ========== 3. 수첩 ========== -->
<section id="note" hidden><div class="wrap">
  <h2>취재 수첩</h2>
  <p class="lead">수첩에 담은 대답만 인터뷰 카드로 저장됩니다.</p>
  <div class="who">
    <input id="reporter" placeholder="기자 이름 (예: 3학년 2반 김하늘)" autocomplete="off">
  </div>
  <div id="noteList"></div>
  <div class="acts">
    <button class="btn" id="save">인터뷰 카드 저장</button>
    <button class="btn ghost" id="backTalk">인터뷰로 돌아가기</button>
  </div>
</div></section>

<canvas id="cv" hidden></canvas>

(function(){

  A.forEach(function(x){

      '<span class="nm">'+x.name+'</span></div>'+

/* ---- 화면 전환 ---- */
function show(id){
  ["#pick","#talk","#note"].forEach(function(s){$(s).hidden = (s!==id)});
  window.scrollTo(0,0);
}
function open(x){
  cur=x; asked={}; notes=[]; seq=0;
  document.documentElement.style.setProperty("--tone",x.tone);
  $("#bar").style.setProperty("--tone",x.tone);
  $("#barFace").innerHTML=IC[x.icon];
  $("#barName").textContent=x.name;
  $("#barSub").textContent=x.rank+" · "+x.where;
  $("#thread").innerHTML="";
  $("#chips").innerHTML="";
  K.forEach(function(k){
    var c=document.createElement("button");
    c.className="chip"; c.textContent=LABEL[k]; c.dataset.k=k;
    c.onclick=function(){ ask(LABEL[k],k) };
    $("#chips").appendChild(c);
  });
  badge();
  show("#talk");
  say("it","안녕! 나에게 궁금한 걸 물어봐. 아래 질문을 눌러도 되고, 직접 써도 돼.",null);
}
$("#toPick").onclick=function(){ show("#pick") };
$("#toNote").onclick=function(){ renderNote(); show("#note") };
$("#backTalk").onclick=function(){ show("#talk") };

    var id=++seq, qNow=lastQ, srcTxt=SRC[cur.icon][key]||"";
    var row=document.createElement("div"); row.className="btnrow";
    var k=document.createElement("button");
    k.className="keep"; k.textContent="＋ 수첩에 담기";
    k.onclick=function(){
      var i=notes.findIndex(function(n){return n.id===id});
      if(i>-1){ notes.splice(i,1); k.className="keep"; k.textContent="＋ 수첩에 담기"; }
      else { notes.push({id:id,q:qNow,a:text,s:srcTxt}); k.className="keep on"; k.textContent="✓ 수첩에 담음"; }
      badge();
    };
    row.appendChild(k);
    var box=document.createElement("div");
    box.className="srcbox"; box.hidden=true;
    box.innerHTML='<b>이 대답의 근거</b>'+esc(srcTxt);
    var sb=document.createElement("button");
    sb.className="srcbtn"; sb.textContent="출처";
    sb.onclick=function(){
      box.hidden=!box.hidden;
      sb.className = box.hidden ? "srcbtn" : "srcbtn on";
    };
    row.appendChild(sb);
    t.appendChild(row);
    t.appendChild(box);
  }
  $("#thread").appendChild(t);
  window.scrollTo(0,document.body.scrollHeight);
}
var lastQ="";
function match(q){
  var best=null,hi=0;
  K.forEach(function(k){
    var n=0;
    CUE[k].forEach(function(c){ if(q.indexOf(c)>-1) n++ });
    if(n>hi){hi=n;best=k}
  });
  return best;
}
function ask(text,key){
  lastQ=text;
  say("me",text,null);
  var k = key || match(text);
  var chip=$('#chips .chip[data-k="'+k+'"]');
  if(chip) chip.className="chip used";
  asked[k]=true;
  var t=document.createElement("div");
  t.className="turn it"; t.innerHTML='<div class="bub dots">…</div>';
  $("#thread").appendChild(t);
  window.scrollTo(0,document.body.scrollHeight);
  setTimeout(function(){
    t.remove();
    if(k){ say("it",cur.a[k],k); }
    else {
      var rest=K.filter(function(x){return !asked[x]});
      var tip = rest.length ? "\n\n대신 이건 어때? “"+LABEL[rest[0]]+"”" : "";
      say("it","음… 그건 내가 아직 대답을 준비하지 못했어. 조금 더 쉬운 말로 다시 물어봐 줄래?"+tip,null);
    }
  },420);
}
$("#send").onclick=function(){
  var v=$("#q").value.trim();
  if(!v) return;
  $("#q").value=""; ask(v,null);
};
$("#q").addEventListener("keydown",function(e){ if(e.key==="Enter") $("#send").click() });
function badge(){
  var b=$("#cnt");
  b.hidden = notes.length===0;
  b.textContent = notes.length;
}

/* ---- 수첩 ---- */
function renderNote(){
  var L=$("#noteList");
  document.documentElement.style.setProperty("--tone",cur.tone);
  if(!notes.length){
    L.innerHTML='<div class="empty">아직 담은 대답이 없어요.<br>인터뷰 화면에서 마음에 드는 대답 아래의 <b>＋ 수첩에 담기</b>를 눌러 보세요.</div>';
    return;
  }
  L.innerHTML="";
  notes.forEach(function(n,i){
    var d=document.createElement("div");
    d.className="note-item"; d.style.setProperty("--tone",cur.tone);
    d.innerHTML='<div class="q">'+esc(n.q)+'</div><div class="a">'+esc(n.a)+'</div>'+
      (n.s?'<div class="ns">출처 · '+esc(n.s)+'</div>':'');
    var r=document.createElement("button");
    r.className="rm"; r.textContent="✕ 빼기";
    r.onclick=function(){ notes.splice(i,1); badge(); renderNote() };
    d.appendChild(r); L.appendChild(d);
  });
}
function esc(s){return s.replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}

/* ---- PNG 저장 ---- */
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    if(typeof r==="number") r=[r,r,r,r];
    this.beginPath();
    this.moveTo(x+r[0],y);
    this.lineTo(x+w-r[1],y); this.quadraticCurveTo(x+w,y,x+w,y+r[1]);
    this.lineTo(x+w,y+h-r[2]); this.quadraticCurveTo(x+w,y+h,x+w-r[2],y+h);
    this.lineTo(x+r[3],y+h); this.quadraticCurveTo(x,y+h,x,y+h-r[3]);
    this.lineTo(x,y+r[0]); this.quadraticCurveTo(x,y,x+r[0],y);
    this.closePath(); return this;
  };
}
function wrap(ctx,text,max){
  var out=[],line="";
  for(var i=0;i<text.length;i++){
    var ch=text[i];
    if(ch==="\n"){out.push(line);line="";continue}
    if(ctx.measureText(line+ch).width>max && line){out.push(line);line=ch}
    else line+=ch;
  }
  if(line)out.push(line);
  return out;
}
$("#save").onclick=function(){
  if(!notes.length){ alert("먼저 수첩에 대답을 담아 주세요."); return }
  var url=URL.createObjectURL(new Blob([IC[cur.icon]],{type:"image/svg+xml"}));
  var im=new Image();
  im.onload=function(){ draw(im,url) };
  im.onerror=function(){ draw(null,url) };
  im.src=url;
};
function draw(im,url){
  var W=1000,P=64,CW=W-P*2,S=2;
  var cv=$("#cv"),ctx=cv.getContext("2d");

  var FS='600 34px "IBM Plex Sans KR", sans-serif';
  var FA='400 31px "Gowun Batang", serif';
  var FSRC='400 22px "IBM Plex Sans KR", sans-serif';
  var blocks=[],H=0;
  notes.forEach(function(n){
    ctx.font=FS; var q=wrap(ctx,"Q. "+n.q,CW-56);
    ctx.font=FA; var a=wrap(ctx,n.a,CW-56);
    ctx.font=FSRC; var sl=n.s?wrap(ctx,"출처 · "+n.s,CW-56):[];
    var h=36+q.length*46+16+a.length*50+(sl.length?16+sl.length*32:0)+34;
    blocks.push({q:q,a:a,s:sl,h:h}); H+=h+20;
  });
  var TOP=280, BOT=110;
  cv.width=W*S; cv.height=(TOP+H+BOT)*S; cv.hidden=false;
  ctx.scale(S,S);

  ctx.fillStyle="#E9EFE9"; ctx.fillRect(0,0,W,TOP+H+BOT);
  ctx.fillStyle=cur.tone; ctx.fillRect(0,0,W,196);

  ctx.fillStyle="#fff";
  if(im) ctx.drawImage(im,P,42,92,92);
  if(url) URL.revokeObjectURL(url);
  ctx.font='700 46px "Gowun Batang", serif'; ctx.fillText(cur.name+" 인터뷰",P+112,96);
  ctx.font='400 26px "IBM Plex Sans KR", sans-serif';
  ctx.globalAlpha=.85;
  ctx.fillText(cur.rank+"  ·  "+cur.where,P+112,138);
  ctx.globalAlpha=1;

  var who=($("#reporter").value||"").trim();
  var d=new Date();
  var when=d.getFullYear()+"년 "+(d.getMonth()+1)+"월 "+d.getDate()+"일";
  ctx.fillStyle="#4C6660"; ctx.font='500 27px "IBM Plex Sans KR", sans-serif';
  ctx.fillText((who?who+"  기자":"기자")+"   |   "+when, P, 250);

  var y=TOP;
  blocks.forEach(function(b){
    ctx.fillStyle="#fff"; ctx.roundRect(P,y,CW,b.h-6,14); ctx.fill();
    ctx.fillStyle=cur.tone; ctx.fillRect(P,y,6,b.h-6);
    var ty=y+52;
    ctx.fillStyle="#16332B"; ctx.font=FS;
    b.q.forEach(function(l){ ctx.fillText(l,P+34,ty); ty+=46 });
    ty+=14;
    ctx.fillStyle="#4C6660"; ctx.font=FA;
    b.a.forEach(function(l){ ctx.fillText(l,P+34,ty); ty+=50 });
    if(b.s.length){
      ty+=6;
      ctx.strokeStyle="#D2DED7"; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(P+34,ty-8); ctx.lineTo(P+CW-34,ty-8); ctx.stroke();
      ty+=14;
      ctx.fillStyle="#8AA09A"; ctx.font=FSRC;
      b.s.forEach(function(l){ ctx.fillText(l,P+34,ty); ty+=32 });
    }
    y+=b.h+20;
  });

  ctx.fillStyle="#8AA09A"; ctx.font='400 24px "IBM Plex Sans KR", sans-serif';
  ctx.fillText("한 번도 만난 적 없는 생명을, 우리는 어떻게 지킬 수 있을까?",P,y+46);

  cv.hidden=true;
  cv.toBlob(function(blob){
    var file=new File([blob],cur.name+"_인터뷰.png",{type:"image/png"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:cur.name+" 인터뷰"}).catch(function(){dl(blob)});
    } else dl(blob);
  },"image/png");
};
function dl(blob){
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=cur.name+"_인터뷰.png";
  document.body.appendChild(a); a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);
}
</script>
